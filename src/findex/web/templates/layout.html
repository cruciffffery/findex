<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}findex{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="logo" href="/">findex</a>
      <p class="tag">v1.0 search</p>
      <nav>
        <a href="/">Search</a>
        <a href="/docs">API</a>
        <a href="/health">Health</a>
        <a href="/stats">Stats</a>
      </nav>
    </aside>
    <main class="stage">
      {% block body %}{% endblock %}
    </main>
  </div>
  <footer class="foot">
    <span>findex 1.0 · NumPy + hybrid</span>
    <span>INDEX_PATH / EMBEDDINGS_PATH</span>
  </footer>
</body>
</html>
